# ── Деплой: Netlify (free) ─────────────────────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"

# Env-змінні для build (також можна задати в Netlify Dashboard — вони мають пріоритет).
[build.environment]
  FACEBOOK_URL = "https://www.facebook.com/alekssamart"
  INSTAGRAM_URL = "https://www.instagram.com/aleks_sam_art"
  # Не керує доставкою замовлень (вона — у Dashboard → Forms → Form notifications).
  CONTACT_EMAIL = "alekssam.art@gmail.com"

# `uk` живе на корені `/` без префікса — старі/прямі заходи на `/uk/...` перенаправляємо на корінь.
[[redirects]]
  from = "/uk/*"
  to = "/:splat"
  status = 301

# Форма «Замовити» — в статичному HTML (name="order" + data-netlify="true" у OrderForm.astro);
# redirects для Netlify Forms не потрібні.
